[package]
name = "adaptivemsg-macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for adaptivemsg"
license = "MIT"
repository = "https://github.com/adaptivemsg/adaptivemsg-rust"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
