[package]
name = "adaptivemsg-echo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
adaptivemsg = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = "0.3"
anyhow = "1.0"
typetag = "0.2"
inventory = "0.3"
clap = { version = "4.5", features = ["derive"] }

tracing = "0.1"
[[bin]]
name = "server"
path = "server.rs"

[lib]
name = "adaptivemsg_echo_server"
path = "lib.rs"
