[package]
name = "adaptivemsg-hello-client-blocking"
version = "0.1.0"
edition = "2021"

[dependencies]
adaptivemsg = { path = "../../..", default-features = false, features = ["tcp", "uds", "blocking"] }
adaptivemsg-hello-server = { path = "../server", default-features = false }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = "0.3"
[[bin]]
name = "client-blocking"
path = "client.rs"
