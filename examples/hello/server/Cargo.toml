[package]
name = "adaptivemsg-hello-server"
version = "0.1.0"
edition = "2021"

[features]
default = ["server"]
# The handlers and the server binary. Clients that only need the messages turn
# it off, which leaves out tokio.
server = [
    "adaptivemsg/tokio",
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:anyhow",
    "dep:inventory",
    "dep:clap",
]

[dependencies]
adaptivemsg = { path = "../../..", default-features = false, features = ["tcp", "uds"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
anyhow = { version = "1.0", optional = true }
typetag = "0.2"
inventory = { version = "0.3", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[[bin]]
name = "server"
path = "server.rs"
required-features = ["server"]

[lib]
name = "adaptivemsg_hello_server"
path = "lib.rs"
