[package]
name = "adaptivemsg"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["tcp", "uds"]
tcp = []
uds = []
quic = ["dep:quinn", "dep:rustls"]

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "=1.2.0"
rmp = "=0.8.14"
rmpv = { version = "=1.0.2", features = ["with-serde"] }
tracing = "0.1"
thiserror = "1.0"
inventory = "0.3"
async-trait = "0.1"
anyhow = "1.0"
adaptivemsg-macros = { path = "../adaptivemsg-macros" }

quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", optional = true }

[workspace]
members = ["examples/hello/server", "examples/hello/client", "examples/echo/server", "examples/echo/client"]
