[package]
name = "adaptivemsg"
version = "0.1.4"
edition = "2021"
description = "Adaptive message framework for Rust"
license = "MIT"
repository = "https://github.com/adaptivemsg/adaptivemsg-rust"

[features]
default = ["tcp", "uds", "tokio"]
tcp = []
uds = []
# Server, async client and handlers.
tokio = ["dep:tokio", "dep:async-trait", "dep:rand"]
# Client on std::net and threads; needs no tokio.
blocking = []
quic = ["tokio", "dep:quinn", "dep:rustls"]

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "=1.2.0"
rmp = "=0.8.14"
rmpv = { version = "=1.0.2", features = ["with-serde"] }
postcard = { version = "1.0", features = ["use-std"] }
tracing = "0.1"
thiserror = "1.0"
inventory = "0.3"
async-trait = { version = "0.1", optional = true }
anyhow = "1.0"
adaptivemsg-macros = { version = "0.1.0", path = "macros" }

quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", optional = true }
rand = { version = "0.8", optional = true }

[package.metadata.docs.rs]
features = ["blocking"]

[workspace]
members = [
    "macros",
    "cmd/amgen",
    "examples/hello/server",
    "examples/hello/client",
    "examples/hello/client-blocking",
    "examples/echo/server",
    "examples/echo/client",
]
